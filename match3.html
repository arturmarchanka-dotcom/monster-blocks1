<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#170e35"><title>Monster Blocks Match</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#40337a,#160d32 70%);font-family:system-ui,-apple-system,sans-serif;color:white;text-align:center}main{max-width:540px;margin:auto;padding:14px 10px 30px}h1{margin:5px 0 0;font-size:clamp(28px,7vw,42px);color:#ffce55;text-shadow:0 4px #9b3981,0 7px 12px #000}.sub{font-size:13px;color:#d8c3fa}.stats{display:flex;gap:8px;margin:18px 0 12px}.stat{flex:1;background:linear-gradient(#503477,#2b1a4e);border:2px solid #9b6bd7;border-radius:15px;padding:8px 2px;font-size:12px}.stat b{display:block;font-size:24px;color:#ffe07b}.banner{display:flex;align-items:center;justify-content:space-between;background:#261741;border:2px solid #a15bda;border-radius:15px;padding:10px 14px;margin:10px 0;font-weight:800}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;padding:6px;border:3px solid #ad70ff;border-radius:16px;background:#140b2b;box-shadow:0 0 26px #a344ed66;touch-action:none;user-select:none}.tile{aspect-ratio:1;min-width:0;border:1px solid #7455a7;border-radius:9px;background:linear-gradient(150deg,#574179,#30204e);display:grid;place-items:center;font-size:clamp(22px,6.4vw,37px);padding:0;cursor:pointer;transition:transform .15s,opacity .15s;touch-action:none;text-shadow:0 2px 3px #0008}.tile.selected{outline:3px solid #ffda56;transform:scale(1.08);z-index:2}.tile.pop{transform:scale(.25);opacity:.2}.tile:disabled{cursor:default}.controls{display:flex;justify-content:center;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(#ffd267,#f08b32);color:#35143c;font-weight:900;font-size:15px;box-shadow:0 4px #9b4d2a}.hint{color:#dfc8fb;font-size:13px;margin:14px 0}.msg{min-height:28px;color:#ffdf75;font-weight:800;margin:13px 0 4px}.footer{font-size:12px;color:#cdb9ec;margin-top:18px}.overlay{position:fixed;inset:0;background:#100822e8;display:none;place-items:center;padding:22px;z-index:10}.overlay.show{display:grid}.modal{background:#35205c;border:2px solid #bb81ff;border-radius:22px;padding:24px;max-width:350px;width:100%}.modal h2{color:#ffda68}
</style></head><body><main><h1>👾 MONSTER BLOCKS</h1><div class="sub">✨ MATCH • Магическая головоломка ✨</div><div class="stats"><div class="stat">🏆 Рекорд<b id="best">0</b></div><div class="stat">⭐ Очки<b id="score">0</b></div><div class="stat">🎯 Ходы<b id="moves">30</b></div></div><div class="banner"><span>🧛 Уровень <span id="level">1</span></span><span>Цель: <span id="goal">1500</span> ⭐</span></div><div id="board" class="board" aria-label="Игровое поле"></div><div class="msg" id="msg">Собери 3 одинаковых монстра!</div><div class="hint">Проведи пальцем по монстру или нажми на двух соседних</div><div class="controls"><button class="btn" id="restart">↻ Новая игра</button><button class="btn" id="help">❔ Правила</button></div><div class="footer">Собирай 4 и 5 монстров для больших бонусов!</div></main><div class="overlay" id="overlay"><div class="modal"><div style="font-size:54px" id="emoji">🏆</div><h2 id="title"></h2><p id="detail"></p><button class="btn" id="again">Продолжить</button></div></div><script>
"use strict";
const faces=['😈','👁️','🐸','🥶','🧛','🎃'],N=8,$=id=>document.getElementById(id);
let board=[],score=0,moves=30,level=1,best=0,selected=null,busy=false,ended=false;
try{best=Number(localStorage.getItem('monster-match-best')||0)}catch(e){}
const rand=()=>Math.floor(Math.random()*faces.length),wait=ms=>new Promise(r=>setTimeout(r,ms));
function matches(){let found=new Set();for(let y=0;y<N;y++){let x=0;while(x<N){let t=board[y][x],j=x+1;while(j<N&&t!==null&&board[y][j]===t)j++;if(t!==null&&j-x>=3)for(let k=x;k<j;k++)found.add(y*N+k);x=j}}for(let x=0;x<N;x++){let y=0;while(y<N){let t=board[y][x],j=y+1;while(j<N&&t!==null&&board[j][x]===t)j++;if(t!==null&&j-y>=3)for(let k=y;k<j;k++)found.add(k*N+x);y=j}}return [...found]}
function draw(pop=[]){let b=$('board');b.replaceChildren();for(let y=0;y<N;y++)for(let x=0;x<N;x++){let el=document.createElement('button');el.type='button';el.className='tile'+(selected&&selected.x===x&&selected.y===y?' selected':'')+(pop.includes(y*N+x)?' pop':'');el.textContent=board[y][x]===null?'':faces[board[y][x]];el.setAttribute('aria-label','Ряд '+(y+1)+' столбец '+(x+1));el.dataset.x=x;el.dataset.y=y;el.onclick=()=>choose(x,y);el.addEventListener('touchstart',e=>{el.dataset.sx=e.touches[0].clientX;el.dataset.sy=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-Number(el.dataset.sx),dy=e.changedTouches[0].clientY-Number(el.dataset.sy);if(Math.max(Math.abs(dx),Math.abs(dy))>18){e.preventDefault();selected=null;let tx=x+(Math.abs(dx)>Math.abs(dy)?Math.sign(dx):0),ty=y+(Math.abs(dy)>=Math.abs(dx)?Math.sign(dy):0);swap(x,y,tx,ty)}},{passive:false});b.appendChild(el)}$('score').textContent=score;$('moves').textContent=moves;$('level').textContent=level;$('goal').textContent=level*1500;$('best').textContent=best}
function init(next=false){if(next)level++;else{level=1;score=0}moves=30;selected=null;busy=false;ended=false;$('overlay').classList.remove('show');board=Array.from({length:N},()=>Array(N).fill(null));for(let y=0;y<N;y++)for(let x=0;x<N;x++){let t;do{t=rand()}while((x>=2&&board[y][x-1]===t&&board[y][x-2]===t)||(y>=2&&board[y-1][x]===t&&board[y-2][x]===t));board[y][x]=t}if(!hasMove())init(next);$('msg').textContent='Собери 3 одинаковых монстра!';draw()}
function hasMove(){for(let y=0;y<N;y++)for(let x=0;x<N;x++)for(let [dx,dy] of [[1,0],[0,1]]){let xx=x+dx,yy=y+dy;if(xx>=N||yy>=N)continue;[board[y][x],board[yy][xx]]=[board[yy][xx],board[y][x]];let yes=matches().length>0;[board[y][x],board[yy][xx]]=[board[yy][xx],board[y][x]];if(yes)return true}return false}
function choose(x,y){if(busy||ended)return;if(!selected){selected={x,y};draw();return}let a=selected;selected=null;if(a.x===x&&a.y===y){draw();return}if(Math.abs(a.x-x)+Math.abs(a.y-y)!==1){selected={x,y};draw();return}swap(a.x,a.y,x,y)}
async function swap(x,y,xx,yy){if(busy||ended||xx<0||xx>=N||yy<0||yy>=N||Math.abs(x-xx)+Math.abs(y-yy)!==1)return;busy=true;selected=null;[board[y][x],board[yy][xx]]=[board[yy][xx],board[y][x]];draw();await wait(180);if(!matches().length){[board[y][x],board[yy][xx]]=[board[yy][xx],board[y][x]];$('msg').textContent='Нужны три одинаковых подряд!';busy=false;draw();return}moves--;let chain=0;while(true){let hit=matches();if(!hit.length)break;chain++;draw(hit);await wait(220);score+=hit.length*20*chain+(hit.length>=4?hit.length*10:0);$('msg').textContent=chain>1?'🔥 Комбо ×'+chain+'!':'✨ Отлично! +'+hit.length*20;for(let i of hit)board[Math.floor(i/N)][i%N]=null;for(let cx=0;cx<N;cx++){let vals=[];for(let cy=N-1;cy>=0;cy--)if(board[cy][cx]!==null)vals.push(board[cy][cx]);for(let cy=N-1;cy>=0;cy--)board[cy][cx]=N-1-cy<vals.length?vals[N-1-cy]:rand()}draw();await wait(220);if(chain>20)break}if(score>best){best=score;try{localStorage.setItem('monster-match-best',best)}catch(e){}}if(score>=level*1500){ended=true;modal('Уровень пройден!','Набрано '+score+' очков!','🏆','Следующий уровень',()=>init(true))}else if(moves<=0){ended=true;modal('Ходы закончились','Ты набрал '+score+' очков. Попробуй ещё!','👾','Играть снова',()=>init(false))}else if(!hasMove()){for(let y=0;y<N;y++)for(let x=0;x<N;x++)board[y][x]=rand();while(matches().length||!hasMove())for(let y=0;y<N;y++)for(let x=0;x<N;x++)board[y][x]=rand();$('msg').textContent='🔀 Поле перемешано!'}busy=false;draw()}
function modal(title,detail,emoji,button,fn){$('title').textContent=title;$('detail').textContent=detail;$('emoji').textContent=emoji;$('again').textContent=button;$('again').onclick=fn;$('overlay').classList.add('show')}
$('restart').onclick=()=>modal('Новая игра?','Текущий прогресс будет сброшен.','🎃','Начать',()=>init(false));
$('help').onclick=()=>modal('Правила','Меняй местами соседних монстров. Три одинаковых подряд исчезают, сверху падают новые. Цепочки дают больше очков!','✨','Понятно',()=>$('overlay').classList.remove('show'));
init();
</script></body></html>
