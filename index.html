const W=7,H=8,C=['#ff638d','#5ae5c2','#ffc747','#6da5ff','#bd80ff','#ff935a'],board=document.getElementById('board');let cells=[],selected=-1,moves=25,score=0,level=1,stars=0,busy=false,sound=true,mode='',audio;const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n);
function tone(freq=500,dur=.09,type='sine'){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(90,freq/2),audio.currentTime+dur);g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function matches(){let out=new Set;for(let y=0;y<H;y++)for(let x=0;x<W;){let k=y*W+x,j=x+1;while(j<W&&cells[y*W+j]===cells[k])j++;if(j-x>=3)for(let t=x;t<j;t++)out.add(y*W+t);x=j}for(let x=0;x<W;x++)for(let y=0;y<H;){let k=y*W+x,j=y+1;while(j<H&&cells[j*W+x]===cells[k])j++;if(j-y>=3)for(let t=y;t<j;t++)out.add(t*W+x);y=j}return [...out]}
function fill(){cells=Array.from({length:W*H},()=>rand(C.length));let n=0;while(matches().length&&n++<300){for(let i of matches())cells[i]=rand(C.length)}}
function render(falling=false){board.innerHTML='';cells.forEach((v,i)=>{let t=document.createElement('div');t.className='tile'+(selected===i?' selected':'')+(falling?' fall':'');t.dataset.i=i;t.innerHTML='<img draggable="false" alt="monster" src="'+MONSTERS[v]+'" style="width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 3px 2px #0006)">';board.appendChild(t)});$('moves').textContent=moves;$('score').textContent=score;$('level').textContent=level;$('stars').textContent=stars;$('bar').style.width=Math.min(100,score/(level*1200)*100)+'%'}
function msg(s){$('message').textContent=s}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function burst(ids){let rect=$('app').getBoundingClientRect();ids.slice(0,20).forEach(i=>{let t=board.children[i];if(!t)return;let r=t.getBoundingClientRect();let e=document.createElement('div');e.className='spark';e.textContent=['✨','⭐','💫'][rand(3)];e.style.left=(r.left-rect.left+r.width/2)+'px';e.style.top=(r.top-rect.top)+'px';e.style.setProperty('--dx',(rand(120)-60)+'px');e.style.setProperty('--dy',(rand(130)-90)+'px');$('app').appendChild(e);setTimeout(()=>e.remove(),700)})}
async function resolve(){let chain=0;while(true){let hit=matches();if(!hit.length)break;chain++;burst(hit);hit.forEach(i=>board.children[i]?.classList.add('pop'));tone(450+chain*150,.17,'triangle');score+=hit.length*60*chain;msg(chain>1?'✨ AMAZING COMBO x'+chain:'✨ SWEET MATCH!');await wait(260);for(let x=0;x<W;x++){let keep=[];for(let y=H-1;y>=0;y--){let i=y*W+x;if(!hit.includes(i))keep.push(cells[i])}for(let y=H-1;y>=0;y--)cells[y*W+x]=H-1-y<keep.length?keep[H-1-y]:rand(C.length)}render(true);await wait(300)}render();if(score>=level*1200||moves<=0){busy=true;let win=score>=level*1200;stars+=win?3:0;$('modalTitle').textContent=win?'LEVEL COMPLETE!':'OUT OF MOVES';$('modalText').textContent=win?'Amazing! You earned 3 stars!':'Try again and make bigger combos!';$('next').textContent=win?'NEXT LEVEL ▶':'RETRY ▶';$('overlay').classList.add('show');tone(win?880:220,.4);return}busy=false}
async function swap(a,b){if(busy||a===b)return;let ax=a%W,ay=Math.floor(a/W),bx=b%W,by=Math.floor(b/W);if(Math.abs(ax-bx)+Math.abs(ay-by)!==1){selected=b;render();return}busy=true;selected=-1;[cells[a],cells[b]]=[cells[b],cells[a]];render();tone(560,.07);await wait(150);if(!matches().length){[cells[a],cells[b]]=[cells[b],cells[a]];render();msg('Try another swap!');tone(180,.14);busy=false;return}moves--;render();await resolve()}
let down=null;board.addEventListener('pointerdown',e=>{let t=e.target.closest('.tile');if(t)down=+t.dataset.i});board.addEventListener('pointerup',e=>{let t=e.target.closest('.tile');if(down===null)return;let a=down;down=null;let b=t?+t.dataset.i:a;if(a===b){if(mode){power(a);return}if(selected<0){selected=a;render();tone(650,.06)}else{let s=selected;swap(s,a)}}else swap(a,b)});
async function power(i){if(busy)return;busy=true;let hit=[];if(mode==='hammer')hit=[i];if(mode==='boom'){let x=i%W,y=Math.floor(i/W);for(let yy=Math.max(0,y-1);yy<=Math.min(H-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(W-1,x+1);xx++)hit.push(yy*W+xx)}mode='';burst(hit);hit.forEach(k=>board.children[k]?.classList.add('pop'));tone(160,.3,'sawtooth');await wait(250);for(let x=0;x<W;x++){let keep=[];for(let y=H-1;y>=0;y--)if(!hit.includes(y*W+x))keep.push(cells[y*W+x]);for(let y=H-1;y>=0;y--)cells[y*W+x]=H-1-y<keep.length?keep[H-1-y]:rand(C.length)}score+=hit.length*40;render(true);await wait(280);await resolve()}
$('hammer').onclick=()=>{if(busy)return;mode='hammer';msg('🔨 Tap a monster to remove it!');tone(700)};$('boom').onclick=()=>{if(busy)return;mode='boom';msg('💥 Tap to blast 3 × 3!');tone(300)};$('shuffle').onclick=()=>{if(busy)return;fill();render(true);msg('🔀 Monsters shuffled!');tone(750,.2)};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';tone(700)};$('restart').onclick=()=>{level=1;score=0;moves=25;stars=0;start()};$('next').onclick=()=>{let win=score>=level*1200;if(win)level++;score=0;moves=25;start()};function start(){$('overlay').classList.remove('show');selected=-1;busy=false;mode='';fill();render(true);msg('Match 3 monsters!')}start();
