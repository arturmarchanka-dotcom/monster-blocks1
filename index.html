<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#12162e"><title>Monster Blocks</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#344d85,#141832 65%,#0b1026);color:white;font-family:system-ui,-apple-system,sans-serif}main{max-width:530px;margin:auto;padding:12px 9px 25px}.top{display:flex;justify-content:space-between;gap:6px}.pill{border:2px solid #8899d2;border-radius:25px;background:linear-gradient(#424d80,#24294b);padding:7px 12px;font-weight:900;box-shadow:0 4px #0b1025}.hero{text-align:center;padding:16px 0 9px;background:radial-gradient(ellipse,#4d428a55,transparent 70%)}.mascots{font-size:46px;filter:drop-shadow(0 5px 3px #000)}h1{margin:0;line-height:.95;font-size:clamp(33px,9vw,53px);letter-spacing:-1px;color:#a7f72b;-webkit-text-stroke:1px #305e12;text-shadow:0 4px #38681c,0 8px #10132e}h1 span{display:block;color:#ffb52f;-webkit-text-stroke:1px #a34e0a;text-shadow:0 4px #a3520c,0 8px #10132e}.level{text-align:center;margin:10px auto;font-size:19px;font-weight:900;border:3px solid #8189b7;border-radius:16px;background:#403563;padding:7px;max-width:170px}.panel{display:grid;grid-template-columns:70px 1fr 78px;gap:6px;margin-bottom:13px}.box{background:linear-gradient(#394873,#202744);border:2px solid #7086b8;border-radius:13px;padding:7px 3px;text-align:center;box-shadow:0 4px #10152a}.box small{font-size:10px;display:block;color:#c8d8f8}.box strong{font-size:24px;color:#ffe078}.goal{font-size:22px;font-weight:900}.stars{color:#ffe078}.frame{border:4px solid #7196d3;border-radius:19px;padding:6px;background:#142447;box-shadow:0 0 0 3px #10182e,0 12px 30px #0009}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;touch-action:none;user-select:none}.tile{aspect-ratio:1;width:100%;border:1px solid #5e7099;border-radius:9px;background:linear-gradient(145deg,#455981,#1b2a4d);padding:0;display:grid;place-items:center;touch-action:none;box-shadow:inset 0 2px #ffffff26}.tile span{font-size:clamp(23px,6.9vw,40px);filter:drop-shadow(0 3px 2px #0009);transition:transform .15s}.tile.selected{outline:3px solid #ffe77c}.tile.selected span{transform:scale(1.17)}.tile.pop{animation:pop .2s forwards}.tile.fall span{animation:fall .3s ease-out}@keyframes pop{to{transform:scale(.1);opacity:0}}@keyframes fall{from{transform:translateY(-28px);opacity:.1}to{transform:none;opacity:1}}.message{text-align:center;min-height:25px;margin:14px 0 8px;font-weight:900;color:#ffdc87}.boosters{display:flex;justify-content:space-around;gap:8px;margin:10px 0}.boost{width:22%;aspect-ratio:1;border:3px solid #a9b5df;border-radius:50%;background:radial-gradient(circle at 35% 25%,#777fc0,#29285c);font-size:clamp(22px,7vw,37px);box-shadow:inset 0 3px #ffffff66,0 5px #0b1025;position:relative}.boost b{position:absolute;bottom:-5px;right:-2px;background:#8533c1;border:2px solid #e2adff;border-radius:30px;color:white;font-size:12px;padding:1px 6px}.boost.active{outline:3px solid #ffdc75}.actions{text-align:center;margin-top:18px}button.action{border:0;border-radius:20px;background:linear-gradient(#ffeab1,#ffb944);color:#5d350c;font-weight:900;font-size:16px;padding:12px 24px;box-shadow:0 5px #a75b20}.hint{text-align:center;color:#bbc9e8;font-size:12px}.overlay{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;z-index:5;padding:20px}.overlay.show{display:flex}.dialog{max-width:360px;width:100%;background:linear-gradient(#515c97,#252950);border:4px solid #a6b5ec;border-radius:24px;padding:25px;text-align:center}.dialog h2{color:#ffdf76}
</style></head><body><main><div class="top"><div class="pill">❤️ 5</div><div class="pill">🪙 3,250</div><div class="pill">💎 85</div></div><header class="hero"><div class="mascots">👻 🧛 🧟</div><h1>MONSTER<span>BLOCKS</span></h1></header><div class="level" id="level">Level 1</div><div class="panel"><div class="box"><small>MOVES</small><strong id="moves">28</strong></div><div class="box"><small>GOAL: SCORE</small><div class="goal" id="goal">1800</div><div class="stars" id="stars">☆☆☆</div></div><div class="box"><small>SCORE</small><strong id="score">0</strong></div></div><div class="frame"><div class="board" id="board"></div></div><div class="message" id="message">Match three monsters!</div><div class="boosters"><button class="boost" data-power="hammer">🔨<b id="hammerQty">3</b></button><button class="boost" data-power="bomb">💣<b id="bombQty">3</b></button><button class="boost" data-power="rainbow">🌈<b id="rainbowQty">3</b></button><button class="boost" data-power="lightning">⚡<b id="lightningQty">3</b></button></div><div class="actions"><button class="action" id="restart">↻ New Game</button></div><p class="hint">Swipe adjacent monsters to match 3 • Match 4 or 5 for bonuses</p></main><div class="overlay" id="overlay"><div class="dialog"><h2 id="result"></h2><p id="detail"></p><button class="action" id="continue">Continue</button></div></div><script>
(()=>{const N=8,faces=['😈','👻','🎃','👁️','🧟','👾','🧛','🐲'],el=id=>document.getElementById(id);let grid=[],moves=28,score=0,level=1,goal=1800,selected=-1,busy=false,power='',stock={hammer:3,bomb:3,rainbow:3,lightning:3},pointer=null;const rnd=()=>Math.floor(Math.random()*faces.length),idx=(r,c)=>r*N+c,inside=(r,c)=>r>=0&&r<N&&c>=0&&c<N,wait=t=>new Promise(r=>setTimeout(r,t));function matches(){let out=[];for(let r=0;r<N;r++)for(let c=0;c<N;){let e=c+1;while(e<N&&grid[idx(r,e)]===grid[idx(r,c)]&&grid[idx(r,c)]!==null)e++;if(e-c>=3)out.push(Array.from({length:e-c},(_,k)=>idx(r,c+k)));c=e}for(let c=0;c<N;c++)for(let r=0;r<N;){let e=r+1;while(e<N&&grid[idx(e,c)]===grid[idx(r,c)]&&grid[idx(r,c)]!==null)e++;if(e-r>=3)out.push(Array.from({length:e-r},(_,k)=>idx(r+k,c)));r=e}return out}function render(falling=[]){el('board').innerHTML='';grid.forEach((v,i)=>{const b=document.createElement('button');b.className='tile'+(selected===i?' selected':'')+(falling.includes(i)?' fall':'');b.innerHTML='<span>'+(v===null?'':faces[v])+'</span>';b.setAttribute('aria-label','Monster tile');b.addEventListener('pointerdown',e=>{pointer={i,x:e.clientX,y:e.clientY};b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',e=>{if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y,j=pointer.i;pointer=null;if(Math.max(Math.abs(dx),Math.abs(dy))>18){let r=Math.floor(j/N),c=j%N;if(Math.abs(dx)>Math.abs(dy))c+=Math.sign(dx);else r+=Math.sign(dy);if(inside(r,c))swap(j,idx(r,c))}else tap(i)});el('board').appendChild(b)});el('moves').textContent=moves;el('score').textContent=score;el('goal').textContent=goal;el('level').textContent='Level '+level;el('stars').textContent=score>=goal?'★★★':score>=goal*.65?'★★☆':score>=goal*.3?'★☆☆':'☆☆☆';for(const k in stock)el(k+'Qty').textContent=stock[k];document.querySelectorAll('.boost').forEach(b=>b.classList.toggle('active',b.dataset.power===power))}function start(){moves=28;score=0;selected=-1;power='';busy=false;grid=Array.from({length:64},rnd);for(let k=0;k<100;k++){const m=matches();if(!m.length)break;for(const i of new Set(m.flat()))grid[i]=rnd()}if(matches().length)return start();el('overlay').classList.remove('show');el('message').textContent='Match three monsters!';render()}async function cascade(){let chain=0;while(true){const groups=matches();if(!groups.length)break;chain++;const removed=new Set(groups.flat());score+=removed.size*50*chain+groups.filter(g=>g.length>=4).length*120;for(const i of removed)el('board').children[i]?.classList.add('pop');await wait(220);const fresh=[];for(let c=0;c<N;c++){const keep=[];for(let r=N-1;r>=0;r--)if(!removed.has(idx(r,c)))keep.push(grid[idx(r,c)]);for(let r=N-1;r>=0;r--){const k=N-1-r;grid[idx(r,c)]=k<keep.length?keep[k]:rnd();if(k>=keep.length)fresh.push(idx(r,c))}}render(fresh);await wait(310)}render();if(score>=goal)finish(true);else if(moves<=0)finish(false);else{busy=false;el('message').textContent=chain>1?'Amazing combo ×'+chain+'!':'Great match!'}}async function swap(a,b){if(busy||a===b)return;const ar=Math.floor(a/N),ac=a%N,br=Math.floor(b/N),bc=b%N;if(Math.abs(ar-br)+Math.abs(ac-bc)!==1)return;busy=true;selected=-1;[grid[a],grid[b]]=[grid[b],grid[a]];render();await wait(140);if(!matches().length){[grid[a],grid[b]]=[grid[b],grid[a]];render();el('message').textContent='Try another swap';busy=false;return}moves--;await cascade()}async function tap(i){if(busy)return;if(power){if(stock[power]<=0){power='';render();return}busy=true;stock[power]--;let affected=[];const r=Math.floor(i/N),c=i%N;if(power==='hammer')affected=[i];if(power==='bomb')for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(inside(y,x))affected.push(idx(y,x));if(power==='lightning')for(let x=0;x<N;x++)affected.push(idx(r,x));if(power==='rainbow')affected=grid.map((v,j)=>v===grid[i]?j:-1).filter(j=>j>=0);power='';moves=Math.max(0,moves-1);score+=affected.length*65;for(const j of affected)grid[j]=null;for(let x=0;x<N;x++){const keep=[];for(let y=N-1;y>=0;y--)if(grid[idx(y,x)]!==null)keep.push(grid[idx(y,x)]);for(let y=N-1;y>=0;y--)grid[idx(y,x)]=keep[N-1-y]??rnd()}render(affected);await wait(300);await cascade();return}if(selected<0){selected=i;render();return}const old=selected;selected=-1;if(old===i){render();return}await swap(old,i)}function finish(win){busy=true;el('result').textContent=win?'🌟 Level Complete!':'💔 Out of Moves';el('detail').textContent=win?'You scored '+score+' points!':'Try again and make bigger combos.';el('overlay').classList.add('show');el('continue').textContent=win?'Next Level':'Try Again';el('continue').onclick=()=>{if(win){level++;goal+=400}start()}}document.querySelectorAll('.boost').forEach(b=>b.onclick=()=>{if(busy)return;power=power===b.dataset.power?'':b.dataset.power;selected=-1;el('message').textContent=power?'Tap a tile to use '+power:'Match three monsters!';render()});el('restart').onclick=()=>{level=1;goal=1800;stock={hammer:3,bomb:3,rainbow:3,lightning:3};start()};start()})();
</script></body></html>
