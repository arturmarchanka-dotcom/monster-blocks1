<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#180f36"><title>Monster Mayhem 3 — New Game</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100a25;font-family:system-ui,-apple-system,sans-serif;color:white;touch-action:none}#game{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#09051bb8;z-index:4}.panel{width:min(88vw,380px);padding:28px;border:2px solid #e8bd65;border-radius:25px;background:linear-gradient(155deg,#57368d,#241347);text-align:center;box-shadow:0 20px 80px #000a}.panel h1{font-size:32px;color:#ffe6a2;margin:0 0 12px;text-shadow:0 3px #9a4c22}.panel p{line-height:1.5}button{border:0;border-radius:20px;background:linear-gradient(#ffe9a0,#ef9b32);color:#4a2051;font-weight:900;padding:14px 25px;font-size:19px;box-shadow:0 5px #a45b28;cursor:pointer}#top{position:absolute;left:0;right:0;top:0;pointer-events:none;text-align:center;padding-top:env(safe-area-inset-top)}#badge{display:inline-block;background:#2e1759dd;border:1px solid #f3cb83;border-radius:0 0 16px 16px;padding:4px 15px;color:#fbe2a4;font-weight:900;letter-spacing:2px;font-size:12px}#status{position:absolute;top:calc(37px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-evenly;gap:5px;padding:0 8px;pointer-events:none}.stat{min-width:80px;background:linear-gradient(#53318b,#28164f);border:2px solid #c899f1;border-radius:17px;padding:5px 9px;box-shadow:0 5px #150c30;font-weight:900;text-align:center;font-size:21px}.stat small{display:block;font-size:10px;color:#e6d0ff;letter-spacing:1px}#actions{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));width:100%;display:flex;justify-content:center;gap:10px}.tool{font-size:13px;padding:10px 15px;border-radius:15px;box-shadow:0 4px #8c4c2c}#toast{position:absolute;left:0;right:0;top:26%;text-align:center;color:#ffed99;font-size:34px;font-weight:1000;text-shadow:0 4px 0 #823d85,0 0 22px #fa76ff;pointer-events:none;opacity:0;transition:opacity .2s}#help{font-size:12px;opacity:.8;margin-top:15px}</style></head><body>
<canvas id="game"></canvas><div id="top"><div id="badge">MONSTER MAYHEM • 3.0</div><div id="status"><div class="stat"><small>LEVEL</small><span id="level">1</span></div><div class="stat"><small>MOVES</small><span id="moves">24</span></div><div class="stat"><small>GOAL</small><span id="goal">0 / 2800</span></div></div></div><div id="toast"></div><div id="actions"><button class="tool" id="shuffle">↻ SHUFFLE</button><button class="tool" id="hammer">✦ HAMMER × <span id="hcount">2</span></button></div><div class="overlay" id="modal"><div class="panel"><h1 id="mtitle">MONSTER MAYHEM</h1><p id="mtext">Enter the enchanted castle! Swap two neighboring monsters to match 3 or more. Create wild combos and clear the board.</p><button id="play">PLAY NOW</button><div id="help">Swipe monsters • Match 3+ • Build combos</div></div></div>
<script>
(()=>{'use strict';const cv=document.getElementById('game'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr,cell,ox,oy,board=[],particles=[],animations=[],level=1,moves=24,score=0,target=2800,hammer=2,mode='intro',selected=null,drag=null,busy=false,clock=0,shake=0;const C=7,R=8,colors=['#9c66e8','#72e55a','#ff7184','#62c6fa','#ffd34e','#f8a64b'];const rand=n=>Math.floor(Math.random()*n),sleep=t=>new Promise(r=>setTimeout(r,t));function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cell=Math.min((W-22)/7,(H-240)/8,64);ox=(W-cell*C)/2;oy=Math.max(110,(H-cell*R)/2+16)}addEventListener('resize',resize);resize();function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function fill(x,y,w,h,r,color){ctx.fillStyle=color;rr(x,y,w,h,r);ctx.fill()}function ellipse(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()}function line(x,y,a,b,col,w=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a,b);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke()}function monster(type,x,y,s){ctx.save();ctx.translate(x,y);let k=s/60;ctx.scale(k,k);ctx.shadowColor='#08041d99';ctx.shadowBlur=9;ctx.shadowOffsetY=5;const base=colors[type];if(type===0){ctx.fillStyle='#3e247b';ctx.beginPath();ctx.moveTo(-24,19);ctx.lineTo(-17,-28);ctx.lineTo(0,-20);ctx.lineTo(17,-28);ctx.lineTo(24,19);ctx.closePath();ctx.fill()}if(type===1){for(let j of [-1,1]){ctx.fillStyle='#3f8d39';ctx.beginPath();ctx.moveTo(j*13,-17);ctx.lineTo(j*25,-32);ctx.lineTo(j*28,-7);ctx.closePath();ctx.fill()}}if(type===2){for(let j of [-1,1]){ctx.fillStyle='#ac405b';ctx.beginPath();ctx.moveTo(j*15,-18);ctx.lineTo(j*25,-28);ctx.lineTo(j*24,-5);ctx.closePath();ctx.fill()}}if(type===3){ellipse(0,6,25,28,'#b8eafa')}else{ellipse(0,3,25,25,base)}ctx.shadowBlur=0;ctx.shadowOffsetY=0;const shine=ctx.createRadialGradient(-9,-14,1,0,0,37);shine.addColorStop(0,'#ffffff75');shine.addColorStop(1,'#00000025');ellipse(0,3,24,24,shine);if(type===3){for(let j of [-1,0,1])ellipse(j*13,25,9,8,'#b8eafa')}if(type===4){fill(-20,-22,40,9,3,'#453e4e');fill(-18,-27,36,7,3,'#60666d');for(let j of [-1,1])ellipse(j*26,4,6,7,'#a1a4a5');line(-25,4,-31,4,'#5a5b63',3)}if(type===5){for(let j of [-1,1]){ellipse(j*19,-18,8,13,'#c26c32');ellipse(j*19,-18,4,7,'#ffca67')}}if(type===2){for(let i=-2;i<=2;i++){line(-23,i*8-7,23,i*8-14,'#ffe7c8',7)}ellipse(-9,-1,7,10,'#fff8ee');ellipse(9,-1,7,10,'#fff8ee')}else{ellipse(-9,-2,8,11,'#fff');ellipse(9,-2,8,11,'#fff')}ellipse(-7,-1,3.6,6,'#2c194d');ellipse(11,-1,3.6,6,'#2c194d');ellipse(-8,-4,1.5,2,'#fff');ellipse(10,-4,1.5,2,'#fff');ctx.strokeStyle='#4b244d';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(1,9,9,0.18,Math.PI-.18);ctx.stroke();if(type===0){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-7,15);ctx.lineTo(-4,22);ctx.lineTo(0,16);ctx.moveTo(7,15);ctx.lineTo(10,22);ctx.lineTo(13,15);ctx.fill();ellipse(-18,10,5,3,'#ff9cba');ellipse(18,10,5,3,'#ff9cba')}if(type===1){for(let j of [-1,1]){ctx.fillStyle='#fff9da';ctx.beginPath();ctx.moveTo(j*6,17);ctx.lineTo(j*11,23);ctx.lineTo(j*13,16);ctx.fill()}}if(type===5){line(-18,-15,-4,-12,'#6d352a',3);line(5,-12,19,-15,'#6d352a',3)}ctx.restore()}function bg(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1c1045');g.addColorStop(.48,'#4e2a78');g.addColorStop(1,'#160b37');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<28;i++){let x=(i*97+31)%W,y=(i*131+Math.sin(clock*.0004+i)*9)%(H*.85);ellipse(x,y,1.2+(i%3),1.2+(i%3),'#e9b5ff65')}ctx.fillStyle='#bfc1ff25';ctx.beginPath();ctx.arc(W*.8,H*.19,54,0,Math.PI*2);ctx.fill();ctx.fillStyle='#190e3b';for(let i=0;i<9;i++){let x=i*W/8-25,h=50+(i*31)%90;ctx.fillRect(x,H*.44-h, W/10,h+20);ctx.beginPath();ctx.moveTo(x-8,H*.44-h);ctx.lineTo(x+W/20,H*.44-h-32);ctx.lineTo(x+W/10+8,H*.44-h);ctx.fill()}for(let i=0;i<6;i++){let x=(i+.5)*W/6;ellipse(x,H*.44-30,5,9,'#ffcf6c88')}}function draw(){clock=performance.now();ctx.clearRect(0,0,W,H);bg();let pad=8;fill(ox-pad,oy-pad,cell*C+pad*2,cell*R+pad*2,19,'#130b35');ctx.strokeStyle='#d7a76f';ctx.lineWidth=3;rr(ox-pad,oy-pad,cell*C+pad*2,cell*R+pad*2,19);ctx.stroke();for(let r=0;r<R;r++)for(let c=0;c<C;c++){let x=ox+c*cell,y=oy+r*cell;fill(x+2,y+2,cell-4,cell-4,8,(r+c)%2?'#56317a':'#663b89');let t=board[r]?.[c];if(t!=null){let a=animations.find(q=>q.r===r&&q.c===c);let scale=a?Math.max(.01,1-a.progress):1;ctx.save();ctx.translate(x+cell/2,y+cell/2);ctx.scale(scale,scale);let gl=ctx.createRadialGradient(-cell*.12,-cell*.18,2,0,0,cell*.46);gl.addColorStop(0,'#ffffff55');gl.addColorStop(1,'#00000020');fill(-cell*.45,-cell*.45,cell*.9,cell*.9,cell*.2,colors[t]);fill(-cell*.41,-cell*.42,cell*.82,cell*.78,cell*.18,gl);monster(t,0,0,cell*.79);ctx.restore()}if(selected&&selected.r===r&&selected.c===c){ctx.strokeStyle='#fff6a8';ctx.lineWidth=4;rr(x+3,y+3,cell-6,cell-6,10);ctx.stroke()}}for(let p of particles){ctx.globalAlpha=Math.max(0,p.life);ellipse(p.x,p.y,p.size,p.size,p.color)}ctx.globalAlpha=1;if(shake>0){shake*=.9;if(shake<.2)shake=0}requestAnimationFrame(draw)}function init(){board=Array.from({length:R},()=>Array(C).fill(null));for(let r=0;r<R;r++)for(let c=0;c<C;c++){let t;do{t=rand(6)}while(c>1&&board[r][c-1]===t&&board[r][c-2]===t||r>1&&board[r-1][c]===t&&board[r-2][c]===t);board[r][c]=t}if(!hasMove())init()}function matches(){let set=new Set;for(let r=0;r<R;r++)for(let c=0;c<C;){let n=c+1;while(n<C&&board[r][n]!=null&&board[r][n]===board[r][c])n++;if(n-c>=3)for(let i=c;i<n;i++)set.add(r*C+i);c=n}for(let c=0;c<C;c++)for(let r=0;r<R;){let n=r+1;while(n<R&&board[n][c]!=null&&board[n][c]===board[r][c])n++;if(n-r>=3)for(let i=r;i<n;i++)set.add(i*C+c);r=n}return [...set]}function hasMove(){for(let r=0;r<R;r++)for(let c=0;c<C;c++)for(let [dr,dc] of [[0,1],[1,0]]){let nr=r+dr,nc=c+dc;if(nr>=R||nc>=C)continue;[board[r][c],board[nr][nc]]=[board[nr][nc],board[r][c]];let yes=matches().length>0;[board[r][c],board[nr][nc]]=[board[nr][nc],board[r][c]];if(yes)return true}return false}function update(){$('level').textContent=level;$('moves').textContent=moves;$('goal').textContent=score+' / '+target;$('hcount').textContent=hammer}function sparkle(r,c,n=12){let x=ox+(c+.5)*cell,y=oy+(r+.5)*cell;for(let i=0;i<n;i++){let angle=Math.random()*Math.PI*2,speed=1+Math.random()*4;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-1,life:1,size:2+Math.random()*4,color:['#ffe68a','#fff','#fd93f7','#8beaff'][rand(4)]})}}setInterval(()=>{particles=particles.filter(p=>p.life>0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.045}},35);function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,700)}let ac;function sound(freq=550){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),v=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.5,ac.currentTime+.12);v.gain.setValueAtTime(.09,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.19)}catch(e){}}async function cascade(){let combo=0;while(true){let m=matches();if(!m.length)break;combo++;if(combo>1)toast('COMBO ×'+combo+'!');animations=m.map(i=>({r:Math.floor(i/C),c:i%C,progress:0}));for(let i of m){let r=Math.floor(i/C),c=i%C;sparkle(r,c);board[r][c]=null}sound(420+combo*125);for(let j=0;j<7;j++){animations.forEach(a=>a.progress=(j+1)/7);await sleep(25)}animations=[];score+=m.length*70*combo;for(let c=0;c<C;c++){let vals=[];for(let r=R-1;r>=0;r--)if(board[r][c]!=null)vals.push(board[r][c]);for(let r=R-1;r>=0;r--)board[r][c]=R-1-r<vals.length?vals[R-1-r]:rand(6)}update();await sleep(190)}if(!hasMove()){toast('MAGIC SHUFFLE!');init()}busy=false;update();if(score>=target){mode='win';show('LEVEL COMPLETE!','The monsters are cheering! Score: '+score,'NEXT LEVEL')}else if(moves<=0){mode='lose';show('OUT OF MOVES','You scored '+score+'. Try the castle again!','TRY AGAIN')}}async function swap(a,b){if(busy||mode!=='playing')return;if(Math.abs(a.r-b.r)+Math.abs(a.c-b.c)!==1)return;busy=true;[board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]];sound(310);await sleep(125);if(!matches().length){[board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]];busy=false;return}moves--;selected=null;update();await cascade()}function pos(e){let b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,c=Math.floor((x-ox)/cell),r=Math.floor((y-oy)/cell);return c>=0&&c<C&&r>=0&&r<R?{r,c}:null}cv.addEventListener('pointerdown',e=>{if(mode!=='playing'||busy)return;drag=pos(e);cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointerup',e=>{if(!drag)return;let end=pos(e),start=drag;drag=null;if(!end)return;if(end.r!==start.r||end.c!==start.c){swap(start,end)}else if(selected){let old=selected;selected=null;swap(old,end)}else selected=end});$('shuffle').onclick=()=>{if(busy||mode!=='playing')return;init();selected=null;toast('SHUFFLED!');sound(600)};$('hammer').onclick=async()=>{if(mode!=='playing'||busy||hammer<=0)return;if(!selected){toast('SELECT A MONSTER');return}busy=true;hammer--;moves--;let {r,c}=selected;selected=null;board[r][c]=null;sparkle(r,c,25);score+=90;for(let row=r;row>0;row--)board[row][c]=board[row-1][c];board[0][c]=rand(6);sound(800);update();await sleep(150);await cascade()};function show(title,body,button){$('mtitle').textContent=title;$('mtext').textContent=body;$('play').textContent=button;$('modal').style.display='flex'}$('play').onclick=()=>{if(mode==='win'){level++;target+=1200}else if(mode==='lose'){level=1;target=2800}moves=24+Math.min(level-1,8);score=0;hammer=2;mode='playing';busy=false;selected=null;init();update();$('modal').style.display='none';sound(650)};init();update();requestAnimationFrame(draw)})();
</script></body></html>
