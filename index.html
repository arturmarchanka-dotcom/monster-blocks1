const W=7,H=8,N=6,$=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),sleep=ms=>new Promise(r=>setTimeout(r,ms));let tiles=[],level=1,moves=24,score=0,stars=0,selected=-1,busy=false,tool='',audioEnabled=true,ctx;const board=$('board');$('heroes').innerHTML=[1,0,3].map(i=>'<img class="hero" alt="Monster character" src="'+MONSTERS[i]+'">').join('');
function beep(f=500){if(!audioEnabled)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.04;o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.12)}catch(e){}}
function find(){let a=new Set();for(let y=0;y<H;y++)for(let x=0;x<W;){let z=x+1;while(z<W&&tiles[y*W+z]===tiles[y*W+x])z++;if(z-x>=3)for(let k=x;k<z;k++)a.add(y*W+k);x=z}for(let x=0;x<W;x++)for(let y=0;y<H;){let z=y+1;while(z<H&&tiles[z*W+x]===tiles[y*W+x])z++;if(z-y>=3)for(let k=y;k<z;k++)a.add(k*W+x);y=z}return [...a]}
function initBoard(){tiles=Array.from({length:W*H},()=>rnd(N));for(let t=0;t<100&&find().length;t++)for(let i of find())tiles[i]=rnd(N)}
function draw(drop=false){board.innerHTML=tiles.map((v,i)=>'<div data-i="'+i+'" class="tile '+(selected===i?'sel ':'')+(drop?'drop':'')+'"><img draggable="false" src="'+MONSTERS[v]+'" alt="monster"></div>').join('');$('level').textContent=level;$('moves').textContent=moves;$('score').textContent=score;$('stars').textContent=stars}
function gravity(hit){const gone=new Set(hit);for(let x=0;x<W;x++){let keep=[];for(let y=H-1;y>=0;y--)if(!gone.has(y*W+x))keep.push(tiles[y*W+x]);for(let y=H-1;y>=0;y--){let idx=H-1-y;tiles[y*W+x]=idx<keep.length?keep[idx]:rnd(N)}}}
async function clearHits(hit,mult=1){hit.forEach(i=>board.children[i]?.classList.add('vanish'));beep(350+mult*120);await sleep(230);gravity(hit);score+=hit.length*65*mult;draw(true);await sleep(270)}
async function settle(){let combo=0;while(find().length&&combo<25){combo++;$('goal').textContent=combo>1?'COMBO x'+combo+'!':'MONSTER MATCH!';await clearHits(find(),combo)}draw();if(score>=level*1500||moves<=0){busy=true;const won=score>=level*1500;if(won)stars+=3;$('result').textContent=won?'CASTLE CLEARED!':'OUT OF MOVES';$('detail').textContent=won?'You earned three stars!':'Try again to break the curse.';$('next').textContent=won?'NEXT LEVEL':'RETRY';$('modal').classList.add('show');return}busy=false;$('goal').textContent='Match 3 monsters to break the curse'}
async function swap(a,b){if(busy)return;if(Math.abs(a%W-b%W)+Math.abs(Math.floor(a/W)-Math.floor(b/W))!==1){selected=b;draw();return}busy=true;selected=-1;[tiles[a],tiles[b]]=[tiles[b],tiles[a]];draw();beep();await sleep(140);if(!find().length){[tiles[a],tiles[b]]=[tiles[b],tiles[a]];draw();busy=false;$('goal').textContent='That swap makes no match';return}moves--;draw();await settle()}
async function useTool(i){if(busy)return;busy=true;let hit=[];if(tool==='hammer')hit=[i];else if(tool==='blast'){let x=i%W,y=Math.floor(i/W);for(let yy=Math.max(0,y-1);yy<=Math.min(H-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(W-1,x+1);xx++)hit.push(yy*W+xx)}tool='';moves=Math.max(0,moves-1);await clearHits(hit);await settle()}
let down=null,px=0,py=0;board.addEventListener('pointerdown',e=>{let t=e.target.closest('.tile');if(!t||busy)return;down=+t.dataset.i;px=e.clientX;py=e.clientY});board.addEventListener('pointerup',e=>{if(down===null)return;let a=down;down=null;if(tool){useTool(a);return}let dx=e.clientX-px,dy=e.clientY-py,b=a;if(Math.max(Math.abs(dx),Math.abs(dy))>18){if(Math.abs(dx)>Math.abs(dy))b=a+(dx>0?1:-1);else b=a+(dy>0?W:-W)}else{let t=e.target.closest('.tile');if(t)b=+t.dataset.i;if(b===a){if(selected<0){selected=a;draw();return}b=a;a=selected;selected=-1}}if(b>=0&&b<W*H)swap(a,b)});board.addEventListener('pointercancel',()=>down=null);
$('shuffle').onclick=()=>{if(busy)return;moves=Math.max(0,moves-1);initBoard();draw(true);beep(800);$('goal').textContent='Monsters shuffled!';if(moves===0)settle()};$('hammer').onclick=()=>{tool='hammer';$('goal').textContent='Tap one monster to remove it'};$('blast').onclick=()=>{tool='blast';$('goal').textContent='Tap a monster to blast 3 × 3'};$('sound').onclick=()=>{audioEnabled=!audioEnabled;$('sound').textContent=audioEnabled?'♫ ON':'♫ OFF'};$('restart').onclick=()=>{level=1;stars=0;score=0;moves=24;start()};$('next').onclick=()=>{if(score>=level*1500)level++;score=0;moves=24;start()};function start(){busy=false;selected=-1;tool='';$('modal').classList.remove('show');$('goal').textContent='Match 3 monsters to break the curse';initBoard();draw(true)}start();
