<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#271346"><title>Monster Blocks Magic</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,sans-serif;color:#fff}body{background:radial-gradient(ellipse at 50% 12%,#8751c5,#35165d 60%,#150d31)}.app{height:100dvh;max-width:490px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);position:relative;overflow:hidden}.app:before{content:"✦　✧　✦　✧　✦";position:absolute;top:15%;left:0;width:100%;font-size:32px;color:#ffffff33;pointer-events:none;animation:twinkle 3s infinite alternate}@keyframes twinkle{to{opacity:.2;transform:translateY(-12px)}}header{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;z-index:1}.round{background:linear-gradient(#7d51c9,#54318f);border:2px solid #bd91fa;border-radius:18px;padding:7px 13px;box-shadow:0 5px #2b174c;font-weight:900}.title{text-align:center;font-size:clamp(25px,7vw,38px);font-weight:1000;letter-spacing:-1px;text-shadow:0 4px #6e2e87,0 7px #1c113c}.title span{color:#ffe76e}.sub{text-align:center;font-size:12px;font-weight:800;color:#eacfff;letter-spacing:2px}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 8px}.stat{background:linear-gradient(160deg,#9c58df,#542c9c);border:2px solid #cfa2ff;border-radius:18px;text-align:center;padding:7px 2px;box-shadow:0 5px #24103d}.stat small{display:block;color:#f6d9ff;font-size:11px;font-weight:800}.stat strong{font-size:22px}.progress{height:17px;border-radius:20px;border:3px solid #b98df3;background:#241343;overflow:hidden;margin:5px 3px 12px}.bar{height:100%;width:0%;background:linear-gradient(90deg,#f9a343,#ffe96c);transition:width .3s;box-shadow:0 0 15px #ffeb88}.boardwrap{position:relative;margin:auto 0;background:linear-gradient(140deg,#e7b9ff,#9e5ae0 30%,#6635b5);padding:9px;border:3px solid #ffdd97;border-radius:25px;box-shadow:0 10px 0 #31155b,0 18px 35px #100728aa}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;aspect-ratio:7/8;background:#341a70;border-radius:16px;padding:5px;box-shadow:inset 0 4px 12px #100a39}.tile{position:relative;border-radius:12px;display:flex;align-items:center;justify-content:center;min-width:0;user-select:none;transition:transform .16s,filter .16s;background:linear-gradient(140deg,#7652b9,#46277f);box-shadow:inset 0 2px 4px #ffffff28}.tile:nth-child(odd){background:linear-gradient(140deg,#8057bd,#4a2981)}.tile.selected{outline:3px solid #fff69b;transform:scale(1.09);z-index:2}.tile.pop{animation:pop .25s ease-in forwards}.tile.fall{animation:fall .28s ease-out}.face{position:relative;width:88%;height:85%;border-radius:42% 42% 45% 45%;background:radial-gradient(circle at 30% 20%,#ffffff99,transparent 34%),var(--c);box-shadow:inset -4px -6px #0002,inset 2px 3px #fff6,0 4px 1px #0004;animation:bob 2.5s ease-in-out infinite;animation-delay:var(--delay)}.face:before,.face:after{content:"";position:absolute;top:-8%;width:24%;height:23%;background:var(--c);border-radius:70% 20% 30% 10%;border:2px solid #ffffff77}.face:before{left:12%;transform:rotate(-28deg)}.face:after{right:12%;transform:rotate(65deg)}.eyes{position:absolute;top:30%;left:22%;width:56%;display:flex;justify-content:space-between}.eye{width:28%;aspect-ratio:1;background:white;border-radius:50%;position:relative;box-shadow:0 1px 2px #0004}.eye:after{content:"";position:absolute;top:34%;left:38%;width:40%;height:43%;border-radius:50%;background:#231343}.mouth{position:absolute;left:42%;top:66%;width:18%;height:12%;background:#482041;border-radius:20% 20% 80% 80%}.cheek{position:absolute;top:57%;width:14%;height:9%;background:#ff9fbd99;border-radius:50%}.cheek.l{left:12%}.cheek.r{right:12%}@keyframes bob{50%{transform:translateY(-2px) rotate(2deg)}}@keyframes pop{to{transform:scale(0) rotate(25deg);opacity:0}}@keyframes fall{from{transform:translateY(-35px) scale(.8);opacity:.4}to{transform:translateY(0) scale(1);opacity:1}}.bottom{display:flex;align-items:center;justify-content:space-around;gap:8px;margin:17px 0 10px}.power{border:2px solid #ffe2a3;background:linear-gradient(#ffbd57,#ee6c42);color:#542143;font-weight:1000;font-size:13px;border-radius:19px;padding:10px 6px;flex:1;box-shadow:0 5px #8c3651}.power:active{transform:translateY(4px);box-shadow:0 1px #8c3651}.message{text-align:center;min-height:26px;font-size:15px;font-weight:900;color:#ffe78c;text-shadow:0 2px #52226f}.overlay{position:absolute;inset:0;background:#1c0c3ad9;z-index:10;display:none;align-items:center;justify-content:center}.overlay.show{display:flex}.modal{width:85%;padding:25px;background:linear-gradient(#9958db,#47228e);border:3px solid #ffe1a0;border-radius:30px;text-align:center;box-shadow:0 15px 40px #0008}.modal h2{font-size:32px;margin:5px}.modal button{padding:14px 35px;border:0;border-radius:20px;background:linear-gradient(#ffe97b,#ff9e47);font-size:20px;font-weight:1000;color:#602855}.spark{position:absolute;pointer-events:none;z-index:5;font-size:26px;animation:spark .65s forwards}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}@media(max-height:680px){.hud{margin:6px 0}.boardwrap{padding:6px}.bottom{margin:8px 0}.title{font-size:24px}.stat strong{font-size:18px}}
</style></head><body><div class="app" id="app"><header><button class="round" id="sound">🔊</button><div class="round">⭐ <span id="stars">0</span></div><button class="round" id="restart">↻</button></header><div class="title">MONSTER <span>MAGIC</span></div><div class="sub">MATCH • BLAST • SMILE</div><div class="hud"><div class="stat"><small>LEVEL</small><strong id="level">1</strong></div><div class="stat"><small>MOVES</small><strong id="moves">25</strong></div><div class="stat"><small>SCORE</small><strong id="score">0</strong></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="message" id="message">Match 3 monsters!</div><div class="boardwrap"><div class="board" id="board"></div></div><div class="bottom"><button class="power" id="shuffle">🔀 SHUFFLE</button><button class="power" id="hammer">🔨 HAMMER</button><button class="power" id="boom">💥 BLAST</button></div><div class="overlay" id="overlay"><div class="modal"><div style="font-size:55px">🏆</div><h2 id="modalTitle">Level complete!</h2><p id="modalText"></p><button id="next">PLAY ▶</button></div></div></div><script>
const W=7,H=8,C=['#ff638d','#5ae5c2','#ffc747','#6da5ff','#bd80ff','#ff935a'],board=document.getElementById('board');let cells=[],selected=-1,moves=25,score=0,level=1,stars=0,busy=false,sound=true,mode='',audio;const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n);
function tone(freq=500,dur=.09,type='sine'){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(90,freq/2),audio.currentTime+dur);g.gain.setValueAtTime(.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function matches(){let out=new Set;for(let y=0;y<H;y++)for(let x=0;x<W;){let k=y*W+x,j=x+1;while(j<W&&cells[y*W+j]===cells[k])j++;if(j-x>=3)for(let t=x;t<j;t++)out.add(y*W+t);x=j}for(let x=0;x<W;x++)for(let y=0;y<H;){let k=y*W+x,j=y+1;while(j<H&&cells[j*W+x]===cells[k])j++;if(j-y>=3)for(let t=y;t<j;t++)out.add(t*W+x);y=j}return [...out]}
function fill(){cells=Array.from({length:W*H},()=>rand(C.length));let n=0;while(matches().length&&n++<300){for(let i of matches())cells[i]=rand(C.length)}}
function render(falling=false){board.innerHTML='';cells.forEach((v,i)=>{let t=document.createElement('div');t.className='tile'+(selected===i?' selected':'')+(falling?' fall':'');t.dataset.i=i;t.innerHTML='<div class="face" style="--c:'+C[v]+';--delay:'+(-i%5*.3)+'s"><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="mouth"></div><div class="cheek l"></div><div class="cheek r"></div></div>';board.appendChild(t)});$('moves').textContent=moves;$('score').textContent=score;$('level').textContent=level;$('stars').textContent=stars;$('bar').style.width=Math.min(100,score/(level*1200)*100)+'%'}
function msg(s){$('message').textContent=s}function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function burst(ids){let rect=$('app').getBoundingClientRect();ids.slice(0,20).forEach(i=>{let t=board.children[i];if(!t)return;let r=t.getBoundingClientRect();let e=document.createElement('div');e.className='spark';e.textContent=['✨','⭐','💫'][rand(3)];e.style.left=(r.left-rect.left+r.width/2)+'px';e.style.top=(r.top-rect.top)+'px';e.style.setProperty('--dx',(rand(120)-60)+'px');e.style.setProperty('--dy',(rand(130)-90)+'px');$('app').appendChild(e);setTimeout(()=>e.remove(),700)})}
async function resolve(){let chain=0;while(true){let hit=matches();if(!hit.length)break;chain++;burst(hit);hit.forEach(i=>board.children[i]?.classList.add('pop'));tone(450+chain*150,.17,'triangle');score+=hit.length*60*chain;msg(chain>1?'✨ AMAZING COMBO x'+chain:'✨ SWEET MATCH!');await wait(260);for(let x=0;x<W;x++){let keep=[];for(let y=H-1;y>=0;y--){let i=y*W+x;if(!hit.includes(i))keep.push(cells[i])}for(let y=H-1;y>=0;y--)cells[y*W+x]=H-1-y<keep.length?keep[H-1-y]:rand(C.length)}render(true);await wait(300)}render();if(score>=level*1200||moves<=0){busy=true;let win=score>=level*1200;stars+=win?3:0;$('modalTitle').textContent=win?'LEVEL COMPLETE!':'OUT OF MOVES';$('modalText').textContent=win?'Amazing! You earned 3 stars!':'Try again and make bigger combos!';$('next').textContent=win?'NEXT LEVEL ▶':'RETRY ▶';$('overlay').classList.add('show');tone(win?880:220,.4);return}busy=false}
async function swap(a,b){if(busy||a===b)return;let ax=a%W,ay=Math.floor(a/W),bx=b%W,by=Math.floor(b/W);if(Math.abs(ax-bx)+Math.abs(ay-by)!==1){selected=b;render();return}busy=true;selected=-1;[cells[a],cells[b]]=[cells[b],cells[a]];render();tone(560,.07);await wait(150);if(!matches().length){[cells[a],cells[b]]=[cells[b],cells[a]];render();msg('Try another swap!');tone(180,.14);busy=false;return}moves--;render();await resolve()}
let down=null;board.addEventListener('pointerdown',e=>{let t=e.target.closest('.tile');if(t)down=+t.dataset.i});board.addEventListener('pointerup',e=>{let t=e.target.closest('.tile');if(down===null)return;let a=down;down=null;let b=t?+t.dataset.i:a;if(a===b){if(mode){power(a);return}if(selected<0){selected=a;render();tone(650,.06)}else{let s=selected;swap(s,a)}}else swap(a,b)});
async function power(i){if(busy)return;busy=true;let hit=[];if(mode==='hammer')hit=[i];if(mode==='boom'){let x=i%W,y=Math.floor(i/W);for(let yy=Math.max(0,y-1);yy<=Math.min(H-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(W-1,x+1);xx++)hit.push(yy*W+xx)}mode='';burst(hit);hit.forEach(k=>board.children[k]?.classList.add('pop'));tone(160,.3,'sawtooth');await wait(250);for(let x=0;x<W;x++){let keep=[];for(let y=H-1;y>=0;y--)if(!hit.includes(y*W+x))keep.push(cells[y*W+x]);for(let y=H-1;y>=0;y--)cells[y*W+x]=H-1-y<keep.length?keep[H-1-y]:rand(C.length)}score+=hit.length*40;render(true);await wait(280);await resolve()}
$('hammer').onclick=()=>{if(busy)return;mode='hammer';msg('🔨 Tap a monster to remove it!');tone(700)};$('boom').onclick=()=>{if(busy)return;mode='boom';msg('💥 Tap to blast 3 × 3!');tone(300)};$('shuffle').onclick=()=>{if(busy)return;fill();render(true);msg('🔀 Monsters shuffled!');tone(750,.2)};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';tone(700)};$('restart').onclick=()=>{level=1;score=0;moves=25;stars=0;start()};$('next').onclick=()=>{let win=score>=level*1200;if(win)level++;score=0;moves=25;start()};function start(){$('overlay').classList.remove('show');selected=-1;busy=false;mode='';fill();render(true);msg('Match 3 monsters!')}start();
</script></body></html>
